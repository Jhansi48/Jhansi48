<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 110" width="100%" height="100%">
  <defs>
    <!-- Accent Gradients -->
    <linearGradient id="violetCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B7CFF" />
      <stop offset="100%" stop-color="#62E6D7" />
    </linearGradient>
  </defs>

  <!-- Card 1: LeetCode -->
  <g transform="translate(0, 0)">
    <!-- Card Frame -->
    <rect width="220" height="110" fill="#0A0C10" rx="6" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    <!-- Gradient Top Accent Line -->
    <rect width="220" height="2" fill="url(#violetCyan)" rx="1" />
    <!-- Metrics -->
    <text x="20" y="48" fill="#F4F6FB" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="800">209+</text>
    <text x="20" y="74" fill="#9AA2B3" font-family="monospace" font-size="12" font-weight="600">LeetCode Problems</text>
    <text x="20" y="88" fill="#8B7CFF" font-family="monospace" font-size="11" font-weight="600">Solved</text>
  </g>

  <!-- Card 2: Google Cloud -->
  <g transform="translate(232, 0)">
    <!-- Card Frame -->
    <rect width="220" height="110" fill="#0A0C10" rx="6" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    <!-- Gradient Top Accent Line -->
    <rect width="220" height="2" fill="url(#violetCyan)" rx="1" />
    <!-- Metrics -->
    <text x="20" y="48" fill="#F4F6FB" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">SELECTED</text>
    <text x="20" y="74" fill="#9AA2B3" font-family="monospace" font-size="12" font-weight="600">Google Cloud Arcade</text>
    <text x="20" y="88" fill="#62E6D7" font-family="monospace" font-size="11" font-weight="600">Facilitator 2026</text>
  </g>

  <!-- Card 3: Amazon ML School -->
  <g transform="translate(464, 0)">
    <!-- Card Frame -->
    <rect width="220" height="110" fill="#0A0C10" rx="6" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    <!-- Gradient Top Accent Line -->
    <rect width="220" height="2" fill="url(#violetCyan)" rx="1" />
    <!-- Metrics -->
    <text x="20" y="48" fill="#F4F6FB" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">SHORTLISTED</text>
    <text x="20" y="74" fill="#9AA2B3" font-family="monospace" font-size="12" font-weight="600">Amazon ML Summer</text>
    <text x="20" y="88" fill="#8B7CFF" font-family="monospace" font-size="11" font-weight="600">School 2026</text>
  </g>

  <!-- Card 4: Flipkart Grid 8.0 -->
  <g transform="translate(696, 0)">
    <!-- Card Frame -->
    <rect width="220" height="110" fill="#0A0C10" rx="6" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    <!-- Gradient Top Accent Line -->
    <rect width="220" height="2" fill="url(#violetCyan)" rx="1" />
    <!-- Metrics -->
    <text x="20" y="48" fill="#F4F6FB" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">SEMI-FINALIST</text>
    <text x="20" y="74" fill="#9AA2B3" font-family="monospace" font-size="12" font-weight="600">Flipkart Grid 8.0</text>
    <text x="20" y="88" fill="#62E6D7" font-family="monospace" font-size="11" font-weight="600">Round 3 (Semi-Finalist)</text>
  </g>

  <!-- Card 5: B.Tech GPA -->
  <g transform="translate(928, 0)">
    <!-- Card Frame -->
    <rect width="220" height="110" fill="#0A0C10" rx="6" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    <!-- Gradient Top Accent Line -->
    <rect width="220" height="2" fill="url(#violetCyan)" rx="1" />
    <!-- Metrics -->
    <text x="20" y="48" fill="#F4F6FB" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="800">9.19/10</text>
    <text x="20" y="74" fill="#9AA2B3" font-family="monospace" font-size="12" font-weight="600">CGPA • ANITS</text>
    <text x="20" y="88" fill="#8B7CFF" font-family="monospace" font-size="11" font-weight="600">Visakhapatnam</text>
  </g>
