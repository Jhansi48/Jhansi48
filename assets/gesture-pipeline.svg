<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 100" width="100%" height="100%">
  <defs>
    <!-- Accent gradients -->
    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B7CFF" />
      <stop offset="100%" stop-color="#62E6D7" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Frame -->
  <rect x="0.5" y="0.5" width="559" height="99" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" rx="4" />

  <!-- Connecting Line -->
  <line x1="40" y1="40" x2="520" y2="40" stroke="url(#cyanViolet)" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Node 1: Camera -->
  <g transform="translate(40, 40)">
    <circle cx="0" cy="0" r="18" fill="#0A0C10" stroke="#8B7CFF" stroke-width="1.2" filter="url(#glow)" />
    <!-- Camera icon -->
    <rect x="-7" y="-5" width="14" height="10" rx="1" fill="none" stroke="#F4F6FB" stroke-width="1" />
    <circle cx="0" cy="0" r="2.5" fill="none" stroke="#F4F6FB" stroke-width="1" />
    <text x="0" y="32" fill="#9AA2B3" font-family="monospace" font-size="8" text-anchor="middle" font-weight="600">CAMERA</text>
  </g>
  <path d="M 72,40 L 78,40 M 76,37 L 79,40 L 76,43" stroke="#8B7CFF" stroke-width="1" fill="none" />

  <!-- Node 2: Hand/Pose -->
  <g transform="translate(136, 40)">
    <circle cx="0" cy="0" r="18" fill="#0A0C10" stroke="#8B7CFF" stroke-width="1.2" />
    <!-- Hand icon -->
    <path d="M-4,4 L-4,-4 M-1.5,4 L-1.5,-6 M1,4 L1,-6 M3.5,4 L3.5,-4 M-6.5,4 L-6.5,0" stroke="#F4F6FB" stroke-width="1" stroke-linecap="round" />
    <text x="0" y="32" fill="#9AA2B3" font-family="monospace" font-size="8" text-anchor="middle" font-weight="600">HAND / POSE</text>
  </g>
  <path d="M 168,40 L 174,40 M 172,37 L 175,40 L 172,43" stroke="#8B7CFF" stroke-width="1" fill="none" />

  <!-- Node 3: MediaPipe -->
  <g transform="translate(232, 40)">
    <circle cx="0" cy="0" r="18" fill="#0A0C10" stroke="#62E6D7" stroke-width="1.2" filter="url(#glow)" />
    <!-- AI nodes -->
    <circle cx="-4" cy="-4" r="1.5" fill="#62E6D7" />
    <circle cx="4" cy="-4" r="1.5" fill="#62E6D7" />
    <circle cx="0" cy="4" r="1.5" fill="#62E6D7" />
    <path d="M-4,-4 L0,4 L4,-4 Z" fill="none" stroke="#62E6D7" stroke-width="0.8" />
    <text x="0" y="32" fill="#9AA2B3" font-family="monospace" font-size="8" text-anchor="middle" font-weight="600">MEDIAPIPE</text>
  </g>
  <path d="M 264,40 L 270,40 M 268,37 L 271,40 L 268,43" stroke="#62E6D7" stroke-width="1" fill="none" />

  <!-- Node 4: Gesture -->
  <g transform="translate(328, 40)">
    <circle cx="0" cy="0" r="18" fill="#0A0C10" stroke="#62E6D7" stroke-width="1.2" />
    <!-- Gesture sparkle -->
    <path d="M-4,0 L4,0 M0,-4 L0,4" stroke="#F4F6FB" stroke-width="1" />
    <text x="0" y="32" fill="#9AA2B3" font-family="monospace" font-size="8" text-anchor="middle" font-weight="600">GESTURE DETECT</text>
  </g>
  <path d="M 360,40 L 366,40 M 364,37 L 367,40 L 364,43" stroke="#62E6D7" stroke-width="1" fill="none" />

  <!-- Node 5: Action -->
  <g transform="translate(424, 40)">
    <circle cx="0" cy="0" r="18" fill="#0A0C10" stroke="#8B7CFF" stroke-width="1.2" filter="url(#glow)" />
    <!-- Action cursor -->
    <path d="M-4,-4 L4,0 L0,4 Z" fill="none" stroke="#F4F6FB" stroke-width="1" stroke-linejoin="round" />
    <text x="0" y="32" fill="#9AA2B3" font-family="monospace" font-size="8" text-anchor="middle" font-weight="600">ACTION MAP</text>
  </g>
  <path d="M 456,40 L 462,40 M 460,37 L 463,40 L 460,43" stroke="#8B7CFF" stroke-width="1" fill="none" />

  <!-- Node 6: Game Control -->
  <g transform="translate(520, 40)">
    <circle cx="0" cy="0" r="18" fill="rgba(98, 230, 215, 0.05)" stroke="#62E6D7" stroke-width="1.5" filter="url(#glow)" />
    <!-- Screen/Control icon -->
    <rect x="-6" y="-5" width="12" height="8" rx="1" fill="none" stroke="#62E6D7" stroke-width="1.2" />
    <line x1="-3" y1="6" x2="3" y2="6" stroke="#62E6D7" stroke-width="1.2" />
    <line x1="0" y1="3" x2="0" y2="6" stroke="#62E6D7" stroke-width="1.2" />
    <text x="0" y="32" fill="#F4F6FB" font-family="monospace" font-size="8" text-anchor="middle" font-weight="700">GAME CONTROL</text>
  </g>
</svg>
