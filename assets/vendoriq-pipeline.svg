<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240" width="100%" height="100%">
  <defs>
    <!-- Accent gradients -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(139, 124, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(98, 230, 215, 0.08)" />
    </linearGradient>
  </defs>

  <!-- Frame Container -->
  <rect x="0.5" y="0.5" width="179" height="239" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" rx="4" />

  <!-- Node 1: Vendor Data -->
  <g transform="translate(10, 10)">
    <rect width="160" height="32" fill="url(#boxGrad)" stroke="rgba(139, 124, 255, 0.2)" stroke-width="1" rx="4" />
    <path d="M 18,12 L 18,20 M 13,16 L 23,16" stroke="#8B7CFF" stroke-width="1.2" stroke-linecap="round" />
    <text x="32" y="20" fill="#F4F6FB" font-family="monospace" font-size="8.5" font-weight="600" letter-spacing="0.5">VENDOR DATA</text>
  </g>
  <path d="M 90,42 L 90,52 M 87,48 L 90,52 L 93,48" stroke="#8B7CFF" stroke-width="1.2" fill="none" />

  <!-- Node 2: Data Processing -->
  <g transform="translate(10, 54)">
    <rect width="160" height="32" fill="url(#boxGrad)" stroke="rgba(98, 230, 215, 0.2)" stroke-width="1" rx="4" />
    <circle cx="18" cy="16" r="3" fill="none" stroke="#62E6D7" stroke-width="1.2" />
    <text x="32" y="20" fill="#F4F6FB" font-family="monospace" font-size="8.5" font-weight="600" letter-spacing="0.5">DATA PROCESSING</text>
  </g>
  <path d="M 90,86 L 90,96 M 87,92 L 90,96 L 93,92" stroke="#62E6D7" stroke-width="1.2" fill="none" />

  <!-- Node 3: Reliability Analysis -->
  <g transform="translate(10, 98)">
    <rect width="160" height="32" fill="url(#boxGrad)" stroke="rgba(139, 124, 255, 0.2)" stroke-width="1" rx="4" />
    <path d="M 13,20 L 17,13 L 20,17 L 23,12" fill="none" stroke="#8B7CFF" stroke-width="1.2" stroke-linecap="round" />
    <text x="32" y="20" fill="#F4F6FB" font-family="monospace" font-size="8.5" font-weight="600" letter-spacing="0.5">RELIABILITY ANALYSIS</text>
  </g>
  <path d="M 90,130 L 90,140 M 87,136 L 90,140 L 93,136" stroke="#8B7CFF" stroke-width="1.2" fill="none" />

  <!-- Node 4: Risk Signals -->
  <g transform="translate(10, 142)">
    <rect width="160" height="32" fill="url(#boxGrad)" stroke="rgba(98, 230, 215, 0.2)" stroke-width="1" rx="4" />
    <path d="M 13,20 L 23,20 L 18,12 Z" fill="none" stroke="#62E6D7" stroke-width="1.2" stroke-linejoin="round" />
    <text x="32" y="20" fill="#F4F6FB" font-family="monospace" font-size="8.5" font-weight="600" letter-spacing="0.5">RISK SIGNALS</text>
  </g>
  <path d="M 90,174 L 90,184 M 87,180 L 90,184 L 93,180" stroke="#62E6D7" stroke-width="1.2" fill="none" />

  <!-- Node 5: Decision Dashboard -->
  <g transform="translate(10, 186)">
    <rect width="160" height="32" fill="rgba(98, 230, 215, 0.05)" stroke="#62E6D7" stroke-width="1" rx="4" style="filter: drop-shadow(0px 0px 4px rgba(98,230,215,0.15));" />
    <rect x="13" y="12" width="10" height="8" fill="none" stroke="#62E6D7" stroke-width="1.2" />
    <line x1="13" y1="16" x2="23" y2="16" stroke="#62E6D7" stroke-width="1.2" />
    <text x="32" y="20" fill="#F4F6FB" font-family="monospace" font-size="8.5" font-weight="600" letter-spacing="0.5">DECISION SUPPORT</text>
  </g>
</svg>
