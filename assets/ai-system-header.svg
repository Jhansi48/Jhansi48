<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 220" width="100%" height="100%">
  <defs>
    <!-- Background Glows -->
    <radialGradient id="violetGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8B7CFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#62E6D7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>
    
    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="0.75" />
      <circle cx="0" cy="0" r="1" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>
    
    <!-- Node Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Layer -->
  <rect width="830" height="220" fill="#08090D" rx="8" />
  
  <!-- Glow Overlays -->
  <rect width="830" height="220" fill="url(#violetGlow)" rx="8" />
  <rect width="830" height="220" fill="url(#cyanGlow)" rx="8" />
  
  <!-- Dot & Line Grid -->
  <rect width="830" height="220" fill="url(#grid)" rx="8" />
  
  <!-- Thin Outer Frame -->
  <rect x="0.5" y="0.5" width="829" height="219" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" rx="7.5" />

  <!-- Technical Overlay Elements -->
  <!-- Crosshairs -->
  <path d="M12,12 L24,12 M18,6 L18,18" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
  <path d="M818,12 L806,12 M812,6 L812,18" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
  
  <!-- Coordinates & Location Telemetry -->
  <text x="790" y="200" fill="rgba(255, 255, 255, 0.15)" font-family="monospace" font-size="9" text-anchor="end">SYS_LOC // 17.72_83.21 [VTZ]</text>
  <text x="790" y="30" fill="#8B7CFF" font-family="monospace" font-size="9" text-anchor="end" font-weight="600">STATE: active_nodes</text>

  <!-- Left Side: System Information -->
  <g transform="translate(50, 0)">
    <!-- System Header -->
    <text x="0" y="45" fill="#8B7CFF" font-family="monospace" font-size="10" font-weight="600" letter-spacing="2">SYS_BOOT // V1.0.8</text>
    
    <!-- Status Dot & System Online -->
    <g transform="translate(150, 36)">
      <circle cx="6" cy="5" r="4" fill="#62E6D7" filter="url(#glow)" />
      <text x="16" y="9" fill="#62E6D7" font-family="monospace" font-size="9" font-weight="700" letter-spacing="1">● SYSTEM ONLINE</text>
    </g>
    
    <!-- Core Name Title -->
    <text x="0" y="90" fill="#F4F6FB" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.8">JHANSI LAKSHMI SAMBHANA</text>
    
    <!-- Tagline (Primary positioning) -->
    <text x="0" y="125" fill="#62E6D7" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1">AI/ML · GENERATIVE AI · VOICE AI · COMPUTER VISION</text>
    
    <!-- Core Statement -->
    <text x="0" y="165" fill="#9AA2B3" font-family="-apple-system, sans-serif" font-size="15" font-weight="400">
      Building AI that can <tspan fill="#F4F6FB" font-weight="700">understand</tspan>, <tspan fill="#F4F6FB" font-weight="700">predict</tspan>, and <tspan fill="#F4F6FB" font-weight="700">interact</tspan>.
    </text>
  </g>

  <!-- Right Side: Neural Network Graph (Abstract Vector Design) -->
  <g transform="translate(580, 0)">
    <!-- Connections -->
    <path d="M40,55 L100,35 M40,55 L70,105 M100,35 L150,75 M70,105 L150,75 M70,105 L90,165 M150,75 L190,120 M90,165 L190,120" 
          stroke="rgba(139, 124, 255, 0.08)" stroke-width="1.5" fill="none" />
          
    <path d="M40,55 L70,105 M70,105 L150,75 M150,75 L190,120" 
          stroke="rgba(98, 230, 215, 0.15)" stroke-width="1.5" fill="none" />

    <!-- Neural Nodes -->
    <!-- Node A -->
    <circle cx="40" cy="55" r="5" fill="#8B7CFF" filter="url(#glow)" />
    <circle cx="40" cy="55" r="2.5" fill="#FFFFFF" />
    
    <!-- Node B -->
    <circle cx="100" cy="35" r="4" fill="#62E6D7" opacity="0.8" />
    
    <!-- Node C -->
    <circle cx="70" cy="105" r="7" fill="#8B7CFF" filter="url(#glow)" />
    <circle cx="70" cy="105" r="3.5" fill="#FFFFFF" />
    
    <!-- Node D -->
    <circle cx="150" cy="75" r="8" fill="#62E6D7" filter="url(#glow)" />
    <circle cx="150" cy="75" r="4" fill="#FFFFFF" />
    
    <!-- Node E -->
    <circle cx="90" cy="165" r="5" fill="#8B7CFF" opacity="0.8" />
    
    <!-- Node F (Core node connecting back toward name) -->
    <circle cx="190" cy="120" r="8" fill="#62E6D7" filter="url(#glow)" />
    <circle cx="190" cy="120" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
