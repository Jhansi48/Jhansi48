<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 160" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gradientLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B7CFF" />
      <stop offset="50%" stop-color="#62E6D7" />
      <stop offset="100%" stop-color="#8B7CFF" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="830" height="160" fill="#0A0C10" rx="6" />
  <rect x="0.5" y="0.5" width="829" height="159" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" rx="5.5" />

  <!-- Background Tech Grid -->
  <path d="M 0,40 L 830,40 M 0,80 L 830,80 M 0,120 L 830,120 M 166,0 L 166,160 M 332,0 L 332,160 M 498,0 L 498,160 M 664,0 L 664,160" 
        stroke="rgba(255, 255, 255, 0.015)" stroke-width="0.75" />

  <!-- Connection Pipeline Line -->
  <path d="M 90,80 L 740,80" stroke="url(#gradientLine)" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Node 01: Audio In -->
  <g transform="translate(90, 80)">
    <circle cx="0" cy="0" r="24" fill="#0A0C10" stroke="#8B7CFF" stroke-width="1" />
    <circle cx="0" cy="0" r="16" fill="rgba(139, 124, 255, 0.06)" />
    <path d="M-8,-4 L-8,4 M-4,-8 L-4,8 M0,-10 L0,10 M4,-8 L4,8 M8,-4 L8,4" stroke="#8B7CFF" stroke-width="1.5" stroke-linecap="round" />
    <text x="0" y="38" fill="#9AA2B3" font-family="monospace" font-size="9" text-anchor="middle">01 / VOICE INPUT</text>
    <text x="0" y="-30" fill="rgba(255, 255, 255, 0.3)" font-family="monospace" font-size="8" text-anchor="middle">ASR Engine</text>
  </g>

  <!-- Flow Chevron 1 -->
  <path d="M 206,77 L 211,80 L 206,83" stroke="#62E6D7" stroke-width="1.5" fill="none" />

  <!-- Node 02: LiveKit Voice Gateway -->
  <g transform="translate(270, 80)">
    <circle cx="0" cy="0" r="24" fill="#0A0C10" stroke="#62E6D7" stroke-width="1" />
    <circle cx="0" cy="0" r="16" fill="rgba(98, 230, 215, 0.06)" />
    <!-- WebRTC Wave representation -->
    <path d="M-8,-2 Q-4,-8 0,-2 T8,-2" stroke="#62E6D7" stroke-width="1.5" fill="none" />
    <text x="0" y="38" fill="#9AA2B3" font-family="monospace" font-size="9" text-anchor="middle">02 / LIVEKIT GATEWAY</text>
    <text x="0" y="-30" fill="rgba(255, 255, 255, 0.3)" font-family="monospace" font-size="8" text-anchor="middle">WebRTC Stream</text>
  </g>

  <!-- Flow Chevron 2 -->
  <path d="M 390,77 L 395,80 L 390,83" stroke="#8B7CFF" stroke-width="1.5" fill="none" />

  <!-- Node 03: LLM Cognition (Gemini) -->
  <g transform="translate(450, 80)">
    <circle cx="0" cy="0" r="28" fill="#0A0C10" stroke="#8B7CFF" stroke-width="1.5" filter="url(#glow)" />
    <circle cx="0" cy="0" r="20" fill="rgba(139, 124, 255, 0.08)" />
    <!-- AI Sparkle -->
    <path d="M-6,0 L6,0 M0,-6 L0,6 M-4,-4 L4,4 M-4,4 L4,-4" stroke="#8B7CFF" stroke-width="1.5" stroke-linecap="round" />
    <text x="0" y="42" fill="#F4F6FB" font-family="monospace" font-size="9" text-anchor="middle" font-weight="600">03 / GEMINI COGNITION</text>
    <text x="0" y="-34" fill="#62E6D7" font-family="monospace" font-size="8" text-anchor="middle">Function Calling</text>
  </g>

  <!-- Flow Chevron 3 -->
  <path d="M 570,77 L 575,80 L 570,83" stroke="#62E6D7" stroke-width="1.5" fill="none" />

  <!-- Node 04: Action Execution -->
  <g transform="translate(630, 80)">
    <circle cx="0" cy="0" r="24" fill="#0A0C10" stroke="#62E6D7" stroke-width="1" />
    <circle cx="0" cy="0" r="16" fill="rgba(98, 230, 215, 0.06)" />
    <!-- Action Checkmark/Box -->
    <path d="M-6,-2 L-2,3 L6,-5" stroke="#62E6D7" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="38" fill="#9AA2B3" font-family="monospace" font-size="9" text-anchor="middle">04 / DISPATCH ACTION</text>
    <text x="0" y="-30" fill="rgba(255, 255, 255, 0.3)" font-family="monospace" font-size="8" text-anchor="middle">Voice Output (TTS)</text>
  </g>
</svg>
