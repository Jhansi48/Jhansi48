<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 200" width="100%" height="100%">
  <defs>
    <!-- Background Glows -->
    <radialGradient id="violetGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8B7CFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#62E6D7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>
    
    <!-- Linear Gradients for Geometry -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CFF" />
      <stop offset="100%" stop-color="#62E6D7" />
    </linearGradient>
    
    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="830" height="200" fill="#08090D" rx="6" />
  <rect width="830" height="200" fill="url(#violetGlow)" rx="6" />
  <rect width="830" height="200" fill="url(#cyanGlow)" rx="6" />
  <rect width="830" height="200" fill="url(#gridPattern)" rx="6" />
  
  <!-- Outer Border Frame -->
  <rect x="0.5" y="0.5" width="829" height="199" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" rx="5.5" />

  <!-- Abstract Dev Studio Geometry (Right Side) -->
  <!-- Represents the Flow: AI ➔ Data ➔ Intelligence ➔ Software -->
  <g transform="translate(560, 20)">
    <!-- Main Flow Lines -->
    <path d="M 20,80 Q 75,30 130,80 T 240,80" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />
    <path d="M 20,80 C 80,140 140,20 200,80" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

    <!-- AI Node (Left) -->
    <g transform="translate(20, 80)">
      <circle cx="0" cy="0" r="16" fill="rgba(139, 124, 255, 0.08)" stroke="#8B7CFF" stroke-width="1" />
      <circle cx="0" cy="0" r="5" fill="#8B7CFF" />
      <text x="0" y="28" fill="rgba(255, 255, 255, 0.3)" font-family="monospace" font-size="8" text-anchor="middle">AI_PERCEPT</text>
    </g>

    <!-- Data Connector (Mid-Left) -->
    <g transform="translate(85, 45)">
      <rect x="-10" y="-10" width="20" height="20" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" transform="rotate(45)" />
      <circle cx="0" cy="0" r="2.5" fill="#62E6D7" />
      <text x="0" y="22" fill="rgba(255, 255, 255, 0.3)" font-family="monospace" font-size="8" text-anchor="middle">DATA_ENG</text>
    </g>

    <!-- Intelligence Core (Mid-Right) -->
    <g transform="translate(150, 80)">
      <circle cx="0" cy="0" r="22" fill="rgba(98, 230, 215, 0.05)" stroke="url(#primaryGrad)" stroke-width="1.5" />
      <circle cx="0" cy="0" r="8" fill="url(#primaryGrad)" />
      <text x="0" y="34" fill="rgba(255, 255, 255, 0.3)" font-family="monospace" font-size="8" text-anchor="middle">INTEL_CORE</text>
    </g>

    <!-- Software Integration (Right) -->
    <g transform="translate(215, 115)">
      <rect x="-10" y="-10" width="20" height="20" fill="none" stroke="#62E6D7" stroke-width="1" />
      <circle cx="0" cy="0" r="3" fill="#62E6D7" />
      <text x="0" y="24" fill="rgba(255, 255, 255, 0.3)" font-family="monospace" font-size="8" text-anchor="middle">RUNTIME</text>
    </g>
  </g>

  <!-- Left Side: Typography -->
  <g transform="translate(50, 0)">
    <!-- Small Monospace Developer Tag -->
    <text x="0" y="50" fill="#8B7CFF" font-family="monospace" font-size="10" font-weight="600" letter-spacing="2">DEV_STUDIO // PORTFOLIO_V2</text>
    
    <!-- Title / Name -->
    <text x="0" y="92" fill="#F4F6FB" font-family="-apple-system, system-ui, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.8">Jhansi Lakshmi Sambhana</text>
    
    <!-- Role Subheading -->
    <text x="0" y="125" fill="#62E6D7" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1">AI/ML · GENERATIVE AI · VOICE AI · COMPUTER VISION</text>
    
    <!-- Primary Tagline -->
    <text x="0" y="160" fill="#9AA2B3" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="500">
      Building AI that can <tspan fill="#F4F6FB" font-weight="600">understand</tspan>, <tspan fill="#F4F6FB" font-weight="600">predict</tspan>, and <tspan fill="#F4F6FB" font-weight="600">interact</tspan>.
    </text>
  </g>
</svg>
