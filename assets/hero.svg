<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 220" width="100%" height="100%">
  <defs>
    <!-- Radial Gradients for Glows -->
    <radialGradient id="violetGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8B7CFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#62E6D7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>
    
    <!-- Linear Gradients for UI Borders -->
    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CFF" />
      <stop offset="100%" stop-color="#62E6D7" />
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="0.75" />
      <circle cx="0" cy="0" r="0.75" fill="rgba(255, 255, 255, 0.05)" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="830" height="220" fill="#08090D" rx="8" />
  
  <!-- Glow Overlays -->
  <rect width="830" height="220" fill="url(#violetGlow)" rx="8" />
  <rect width="830" height="220" fill="url(#cyanGlow)" rx="8" />
  
  <!-- Grid -->
  <rect width="830" height="220" fill="url(#grid)" rx="8" />
  
  <!-- Thin Outer Frame -->
  <rect x="0.5" y="0.5" width="829" height="219" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" rx="7.5" />

  <!-- Layout Dividers (Asymmetric studio panel look) -->
  <line x1="480" y1="0" x2="480" y2="220" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
  <line x1="0" y1="180" x2="480" y2="180" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.75" />

  <!-- Location Telemetry (Root Level - Bottom Right) -->
  <text x="790" y="200" fill="rgba(255, 255, 255, 0.15)" font-family="monospace" font-size="9" text-anchor="end">ANITS · VISAKHAPATNAM</text>
  <text x="790" y="30" fill="#8B7CFF" font-family="monospace" font-size="9" text-anchor="end" font-weight="600">STATE: ACTIVE BUILDS</text>

  <!-- PANEL A: IDENTITY (LEFT) -->
  <g transform="translate(40, 0)">
    <!-- Metadata label -->
    <text x="0" y="38" fill="rgba(255, 255, 255, 0.25)" font-family="monospace" font-size="8" letter-spacing="1">DEVELOPER STUDIO</text>
    
    <!-- Status Indicator -->
    <circle cx="150" cy="35" r="3.5" fill="#62E6D7" />
    <text x="158" y="38" fill="#62E6D7" font-family="monospace" font-size="8" font-weight="700" letter-spacing="0.5">ONLINE</text>

    <!-- Name -->
    <text x="0" y="80" fill="#F4F6FB" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.8">Jhansi Lakshmi Sambhana</text>
    
    <!-- Specialties -->
    <text x="0" y="112" fill="#8B7CFF" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">AI/ML · GENERATIVE AI · VOICE AI · COMPUTER VISION</text>
    
    <!-- Tagline Statement -->
    <text x="0" y="146" fill="#9AA2B3" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="400">
      Building AI that can <tspan fill="#F4F6FB" font-weight="600">understand</tspan>, <tspan fill="#F4F6FB" font-weight="600">predict</tspan>, and <tspan fill="#F4F6FB" font-weight="600">interact</tspan>.
    </text>

    <!-- Coordinates / Engine Readout -->
    <text x="0" y="200" fill="rgba(255, 255, 255, 0.3)" font-family="monospace" font-size="8">ANITS · VISAKHAPATNAM   ·   AI AGENTS · RAG · FULL-STACK AI APPLICATIONS</text>
  </g>

  <!-- PANEL B: TECHNICAL TELEMETRY (RIGHT) -->
  <g transform="translate(505, 0)">
    <!-- Metadata label -->
    <text x="0" y="38" fill="rgba(255, 255, 255, 0.25)" font-family="monospace" font-size="8" letter-spacing="1">CORE FOCUS · SPECIALTIES</text>

    <!-- Mini Visualizer Grid (4 nodes with status metrics) -->
    <!-- Node 1: ML -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="135" height="42" fill="rgba(255, 255, 255, 0.01)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="0.75" rx="3" />
      <circle cx="15" cy="21" r="3" fill="#8B7CFF" />
      <text x="26" y="20" fill="#F4F6FB" font-family="monospace" font-size="9" font-weight="600">01 · ML MODEL</text>
      <text x="26" y="31" fill="rgba(255, 255, 255, 0.3)" font-family="monospace" font-size="7">Status: active</text>
    </g>

    <!-- Node 2: GENAI -->
    <g transform="translate(150, 60)">
      <rect x="0" y="0" width="135" height="42" fill="rgba(255, 255, 255, 0.01)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="0.75" rx="3" />
      <circle cx="15" cy="21" r="3" fill="#62E6D7" />
      <text x="26" y="20" fill="#F4F6FB" font-family="monospace" font-size="9" font-weight="600">02 · GENERATIVE AI</text>
      <text x="26" y="31" fill="rgba(255, 255, 255, 0.3)" font-family="monospace" font-size="7">Status: active</text>
    </g>

    <!-- Node 3: VOICE -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="135" height="42" fill="rgba(255, 255, 255, 0.01)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="0.75" rx="3" />
      <circle cx="15" cy="21" r="3" fill="#62E6D7" />
      <text x="26" y="20" fill="#F4F6FB" font-family="monospace" font-size="9" font-weight="600">03 · VOICE AI</text>
      <text x="26" y="31" fill="rgba(255, 255, 255, 0.3)" font-family="monospace" font-size="7">Status: active</text>
    </g>

    <!-- Node 4: VISION -->
    <g transform="translate(150, 115)">
      <rect x="0" y="0" width="135" height="42" fill="rgba(255, 255, 255, 0.01)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="0.75" rx="3" />
      <circle cx="15" cy="21" r="3" fill="#8B7CFF" />
      <text x="26" y="20" fill="#F4F6FB" font-family="monospace" font-size="9" font-weight="600">04 · VISION ENGINE</text>
      <text x="26" y="31" fill="rgba(255, 255, 255, 0.3)" font-family="monospace" font-size="7">Status: active</text>
    </g>

    <!-- System Sparkline/Load representation at bottom -->
    <path d="M 0,195 L 40,195 L 48,185 L 56,203 L 64,191 L 72,198 L 80,195 L 140,195 M 150,195 L 285,195" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
    <path d="M 0,195 L 40,195 L 48,185 L 56,203 L 64,191 L 72,198 L 80,195 L 140,195" fill="none" stroke="url(#cyanViolet)" stroke-width="1.5" opacity="0.8" />
    <circle cx="140" cy="195" r="2.5" fill="#62E6D7" />
  </g>
</svg>
