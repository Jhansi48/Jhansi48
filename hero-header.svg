<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 180" width="100%" height="100%">
  <defs>
    <!-- Background Glows -->
    <radialGradient id="violetGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8B7CFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#62E6D7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0" />
    </radialGradient>
    
    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="rgba(255, 255, 255, 0.05)" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="830" height="180" fill="#08090D" rx="8" />
  
  <!-- Glow Overlays -->
  <rect width="830" height="180" fill="url(#violetGlow)" rx="8" />
  <rect width="830" height="180" fill="url(#cyanGlow)" rx="8" />
  
  <!-- Dot Grid -->
  <rect width="830" height="180" fill="url(#dotGrid)" rx="8" />
  
  <!-- Minimalist Thin Border -->
  <rect x="0.5" y="0.5" width="829" height="179" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" rx="7.5" />

  <!-- Layout Grid Lines -->
  <line x1="40" y1="0" x2="40" y2="180" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1" />
  <line x1="790" y1="0" x2="790" y2="180" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1" />

  <!-- Left Side: Typography -->
  <g transform="translate(50, 0)">
    <!-- Sub-heading/Role tag (Monospace styling) -->
    <text x="0" y="48" fill="#62E6D7" font-family="monospace, Courier" font-size="11" font-weight="600" letter-spacing="1.5">AI/ML // GENERATIVE AI // VOICE AI // COMPUTER VISION</text>
    
    <!-- Main Title (Name) -->
    <text x="0" y="92" fill="#F4F6FB" font-family="'Space Grotesk', -apple-system, system-ui, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.8">Jhansi Lakshmi Sambhana</text>
    
    <!-- Tagline Statement -->
    <text x="0" y="130" fill="#9AA2B3" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="400" letter-spacing="-0.2">
      Building AI that can <tspan fill="#8B7CFF" font-weight="500">understand</tspan>, <tspan fill="#8B7CFF" font-weight="500">predict</tspan>, and <tspan fill="#8B7CFF" font-weight="500">interact</tspan>.
    </text>
  </g>
</svg>
